<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KML Offset Tool</title>

<!-- OpenLayers CSS (CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ======================================================
     ROOT / RESET — same survey-ledger token system as the
     Boundary Archive downloader page
     ====================================================== */
  :root{
    --paper:       #efead9;
    --paper-deep:  #e7e0c9;
    --panel-bg:    #f7f4e8;
    --ink:         #1c2a20;
    --ink-soft:    #5c6b5c;
    --pine:        #2f5233;
    --pine-deep:   #1f3a26;
    --brass:       #a6763d;
    --brass-dark:  #8a5f2f;
    --line:        #c7bc9c;
    --alert:       #8a3f34;
    --mono:        'IBM Plex Mono', Consolas, monospace;
    --sans:        'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --serif:       'Fraunces', serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
  }

  /* ======================================================
     HEADER
     ====================================================== */
  header{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 22px;
    background: var(--pine-deep);
    color: var(--paper);
    box-shadow: 0 2px 10px rgba(15,25,18,.25);
    z-index: 20;
    position: relative;
  }

  header .mark{
    width: 28px;height: 28px;
    flex-shrink: 0;
  }

  header .title-block{
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  header h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.08rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  header .subtitle{
    font-size: 0.68rem;
    color: rgba(239,234,217,0.68);
    font-family: var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ======================================================
     LAYOUT
     ====================================================== */
  .app-container{
    display: flex;
    height: calc(100vh - 56px);
    width: 100%;
  }

  /* -------------------- LEFT PANEL -------------------- */
  .panel{
    width: 25%;
    min-width: 300px;
    max-width: 420px;
    background: var(--panel-bg);
    border-right: 1px solid var(--line);
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-section{
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 16px;
    background: var(--paper);
    position: relative;
  }

  .panel-section h2{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
    font-weight: 600;
    font-family: var(--sans);
  }

  .panel-section h2 .step-num{
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--brass-dark);
    letter-spacing: 0.05em;
  }

  .panel-section h2 .step-name{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0;
    text-transform: none;
    color: var(--pine-deep);
  }

  /* File upload */
  .file-drop{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  input[type="file"]{
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 9px 8px;
    border: 1px dashed var(--line);
    border-radius: 2px;
    background: var(--panel-bg);
    color: var(--ink);
    cursor: pointer;
  }

  #statusLine{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    line-height: 1.5;
    word-break: break-word;
  }

  /* Sliders */
  .slider-row{
    margin-bottom: 14px;
  }
  .slider-row:last-child{ margin-bottom: 0; }

  .slider-label-line{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .slider-label-line label{
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink);
  }

  .slider-value{
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--brass-dark);
    background: var(--paper-deep);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 2px;
    min-width: 64px;
    text-align: right;
  }

  input[type="range"]{
    width: 100%;
    accent-color: var(--pine);
    cursor: pointer;
    height: 4px;
  }

  .range-minmax{
    display: flex;
    justify-content: space-between;
    font-size: 0.64rem;
    color: #9a927a;
    font-family: var(--mono);
    margin-top: 2px;
  }

  /* Buttons */
  .btn{
    width: 100%;
    padding: 11px 14px;
    font-family: var(--sans);
    font-size: 0.83rem;
    font-weight: 600;
    letter-spacing: .01em;
    border-radius: 2px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform .12s ease;
  }
  .btn:active{ transform: translateY(1px); }

  .btn-secondary{
    background: transparent;
    color: var(--brass-dark);
    border: 1px solid var(--brass);
  }
  .btn-secondary:hover{ background: rgba(166,118,61,.08); }

  .btn-primary{
    background: var(--pine);
    color: var(--paper);
    box-shadow: 0 6px 16px -8px rgba(31,58,38,.55);
  }
  .btn-primary:hover{ background: var(--pine-deep); }

  .btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-row{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* -------------------- MAP -------------------- */
  .map-wrap{
    flex: 1;
    position: relative;
    height: 100%;
  }

  #map{
    width: 100%;
    height: 100%;
  }

  .map-badge{
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(28,42,32,0.82);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: .04em;
    padding: 5px 10px;
    border-radius: 2px;
    z-index: 5;
    pointer-events: none;
    border: 1px solid rgba(199,188,156,.35);
  }

  /* -------------------- FOOTER -------------------- */
  footer.attribution{
    text-align: center;
    font-size: 10.5px;
    color: #7a7460;
    font-family: var(--mono);
    letter-spacing: .02em;
    padding: 9px 12px;
    background: var(--panel-bg);
    border-top: 1px solid var(--line);
  }
  footer.attribution a{
    color: var(--pine-deep);
    text-decoration: none;
    border-bottom: 1px solid var(--brass);
  }
  footer.attribution a:hover{ color: var(--brass-dark); }

  /* ======================================================
     RESPONSIVE
     ====================================================== */
  @media (max-width: 820px){
    .app-container{
      flex-direction: column;
      height: auto;
    }
    .panel{
      width: 100%;
      max-width: none;
      max-height: 46vh;
      border-right: none;
      border-bottom: 1px solid var(--line);
      order: 2;
    }
    .map-wrap{
      height: 54vh;
      order: 1;
    }
  }
</style>
</head>
<body>

<header>
  <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <circle cx="24" cy="24" r="21" stroke="#c7bc9c" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="2.4" fill="#efead9"/>
    <path d="M24 4 L27 22 L24 24 L21 22 Z" fill="#efead9"/>
    <path d="M24 44 L21 26 L24 24 L27 26 Z" fill="#8a7a52"/>
    <path d="M4 24 L22 21 L24 24 L22 27 Z" fill="#8a7a52"/>
    <path d="M44 24 L26 27 L24 24 L26 21 Z" fill="#8a7a52"/>
  </svg>
  <div class="title-block">
    <h1>KML Offset Tool</h1>
    <span class="subtitle">Cadastral Alignment · Esri World Imagery</span>
  </div>
</header>

<div class="app-container">

  <!-- ============================================================
       LEFT CONTROL PANEL
       ============================================================ -->
  <div class="panel">

    <!-- Upload -->
    <div class="panel-section">
      <h2><span class="step-num">01</span><span class="step-name">Upload KML</span></h2>
      <div class="file-drop">
        <input type="file" id="fileInput" accept=".kml">
        <div id="statusLine">No file loaded.</div>
      </div>
    </div>

    <!-- Display -->
    <div class="panel-section">
      <h2><span class="step-num">02</span><span class="step-name">Display</span></h2>
      <div class="slider-row">
        <div class="slider-label-line">
          <label for="opacitySlider">Opacity</label>
          <span class="slider-value" id="opacityValue">50%</span>
        </div>
        <input type="range" id="opacitySlider" min="0" max="100" step="1" value="50">
        <div class="range-minmax"><span>0%</span><span>100%</span></div>
      </div>
    </div>

    <!-- Offset controls -->
    <div class="panel-section">
      <h2><span class="step-num">03</span><span class="step-name">Positional Offset</span></h2>

      <div class="slider-row">
        <div class="slider-label-line">
          <label for="eastingSlider">Easting (E&#8596;W)</label>
          <span class="slider-value" id="eastingValue">0.00 m</span>
        </div>
        <input type="range" id="eastingSlider" min="-20" max="20" step="0.05" value="0">
        <div class="range-minmax"><span>-20 m</span><span>+20 m</span></div>
      </div>

      <div class="slider-row">
        <div class="slider-label-line">
          <label for="northingSlider">Northing (N&#8596;S)</label>
          <span class="slider-value" id="northingValue">0.00 m</span>
        </div>
        <input type="range" id="northingSlider" min="-20" max="20" step="0.05" value="0">
        <div class="range-minmax"><span>-20 m</span><span>+20 m</span></div>
      </div>

      <div class="slider-row">
        <div class="slider-label-line">
          <label for="rotationSlider">Rotation</label>
          <span class="slider-value" id="rotationValue">0.00&deg;</span>
        </div>
        <input type="range" id="rotationSlider" min="-5" max="5" step="0.01" value="0">
        <div class="range-minmax"><span>-5&deg;</span><span>+5&deg;</span></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="panel-section">
      <h2><span class="step-num">04</span><span class="step-name">Export</span></h2>
      <div class="btn-row">
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
        <button class="btn btn-primary" id="downloadBtn" disabled>Download Corrected KML</button>
      </div>
    </div>

  </div>

  <!-- ============================================================
       MAP
       ============================================================ -->
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-badge">Esri World Imagery</div>
  </div>

</div>

<footer class="attribution">
  © 2026 Debashis Shivamangal. All rights reserved. Map data: <a href="https://www.esri.com/en-us/home" target="_blank">Esri</a>
</footer>

<!-- OpenLayers JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

<script>
(function(){
  "use strict";

  /* ============================================================
     STATE
     ============================================================ */
  var originalKmlText   = null;   // pristine raw KML text, never mutated
  var fileName           = "";     // original uploaded file name
  var currentFeatures    = [];     // ol.Feature[] currently on the map
  var originalGeometries = [];     // pristine clones (EPSG:3857) matching currentFeatures order
  var centroidMerc       = null;   // [x,y] centroid in EPSG:3857, used as rotation anchor
  var centroidLat        = 0;      // latitude (deg) of centroid, used for Mercator scale correction

  /* ============================================================
     DOM REFERENCES
     ============================================================ */
  var fileInput      = document.getElementById("fileInput");
  var statusLine      = document.getElementById("statusLine");

  var opacitySlider   = document.getElementById("opacitySlider");
  var eastingSlider   = document.getElementById("eastingSlider");
  var northingSlider  = document.getElementById("northingSlider");
  var rotationSlider  = document.getElementById("rotationSlider");

  var opacityValue    = document.getElementById("opacityValue");
  var eastingValue    = document.getElementById("eastingValue");
  var northingValue   = document.getElementById("northingValue");
  var rotationValue   = document.getElementById("rotationValue");

  var resetBtn        = document.getElementById("resetBtn");
  var downloadBtn      = document.getElementById("downloadBtn");

  /* ============================================================
     MAP SETUP
     ============================================================ */
  var kmlFormat = new ol.format.KML({ extractStyles: true, showPointNames: false });

  var vectorSource = new ol.source.Vector();

  // Fallback style used only for geometries that carry no KML style of their own.
  var fallbackStyle = new ol.style.Style({
    stroke: new ol.style.Stroke({ color: "#ff3b30", width: 2.5 }),
    fill:   new ol.style.Fill({ color: "rgba(255,59,48,0.18)" }),
    image:  new ol.style.Circle({
      radius: 5,
      fill:   new ol.style.Fill({ color: "#ff3b30" }),
      stroke: new ol.style.Stroke({ color: "#ffffff", width: 1.5 })
    })
  });

  var vectorLayer = new ol.layer.Vector({
    source: vectorSource,
    style: function(feature){
      var s = feature.getStyle();
      return s ? s : fallbackStyle;
    }
  });
  vectorLayer.setOpacity(0.5);

  var imageryLayer = new ol.layer.Tile({
    source: new ol.source.XYZ({
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      attributions: "Esri, Maxar, Earthstar Geographics, and the GIS User Community",
      maxZoom: 20
    })
  });

  var map = new ol.Map({
    target: "map",
    layers: [imageryLayer, vectorLayer],
    view: new ol.View({
      center: ol.proj.fromLonLat([0, 20]),
      zoom: 3
    })
  });

  /* ============================================================
     FILE UPLOAD HANDLING
     ============================================================ */
  fileInput.addEventListener("change", function(evt){
    var file = evt.target.files && evt.target.files[0];
    if (!file) return;

    if (!/\.kml$/i.test(file.name)){
      alert("Please upload a file with a .kml extension.");
      fileInput.value = "";
      return;
    }

    var reader = new FileReader();
    reader.onload = function(e){
      loadKml(e.target.result, file.name);
    };
    reader.onerror = function(){
      alert("Could not read the selected file.");
    };
    reader.readAsText(file);
  });

  /**
   * Parse a KML text string, place its features on the map, capture the
   * pristine (untransformed) geometries, compute the rotation centroid,
   * and zoom the map to the feature extent.
   */
  function loadKml(text, name){
    var features;
    try {
      features = kmlFormat.readFeatures(text, {
        dataProjection: "EPSG:4326",
        featureProjection: "EPSG:3857"
      });
    } catch (err){
      alert("Failed to parse KML: " + err.message);
      return;
    }

    if (!features || features.length === 0){
      alert("No placemark geometry was found in this KML file.");
      return;
    }

    // Commit new state only after successful parsing.
    originalKmlText = text;
    fileName = name;

    vectorSource.clear();
    vectorSource.addFeatures(features);
    currentFeatures = features;

    // Store pristine clones so every transform starts from the original geometry.
    originalGeometries = features.map(function(f){ return f.getGeometry().clone(); });

    // Compute the combined extent -> centroid, used as the rotation anchor
    // for both the live map preview and the exported KML.
    var extent = ol.extent.createEmpty();
    originalGeometries.forEach(function(g){
      ol.extent.extend(extent, g.getExtent());
    });
    centroidMerc = ol.extent.getCenter(extent);
    centroidLat = ol.proj.toLonLat(centroidMerc)[1];

    map.getView().fit(extent, {
      size: map.getSize(),
      padding: [60, 60, 60, 60],
      maxZoom: 19,
      duration: 400
    });

    downloadBtn.disabled = false;
    statusLine.textContent = "Loaded \u201c" + name + "\u201d \u2014 " +
      features.length + " feature" + (features.length !== 1 ? "s" : "");

    resetControls();
  }

  /* ============================================================
     TRANSFORM ENGINE
     ============================================================
     Translation is specified by the user in true ground metres.
     EPSG:3857 (Web Mercator) is conformal but NOT equidistant: one
     map unit only equals one true metre at the equator. At latitude
     phi, map distance = true distance * sec(phi). We therefore scale
     the requested metre offsets by sec(centroidLat) before applying
     them in map units, so the sliders always represent real ground
     metres regardless of where the parcel sits on Earth.
     Rotation is angle-preserving under Web Mercator, so no such
     correction is required for the rotation step.
     ============================================================ */

  function mercatorScaleFactor(latDeg){
    return 1 / Math.cos(latDeg * Math.PI / 180);
  }

  /**
   * Rotate point [x,y] by angleRad (radians, CCW positive) about anchor [ax,ay],
   * then translate by [dx,dy]. All values are in the same linear unit (map units).
   */
  function rotateThenTranslate(x, y, angleRad, anchor, dx, dy){
    var cos = Math.cos(angleRad);
    var sin = Math.sin(angleRad);
    var ox = x - anchor[0];
    var oy = y - anchor[1];
    var rx = ox * cos - oy * sin;
    var ry = ox * sin + oy * cos;
    return [ anchor[0] + rx + dx, anchor[1] + ry + dy ];
  }

  /**
   * Re-derive every feature's displayed geometry from its pristine original,
   * applying the current slider values. Called on every slider "input" event.
   */
  function updateTransform(){
    var easting     = parseFloat(eastingSlider.value);
    var northing    = parseFloat(northingSlider.value);
    var rotationDeg = parseFloat(rotationSlider.value);
    var opacity     = parseFloat(opacitySlider.value);

    // Update the numeric readouts beside each slider.
    eastingValue.textContent  = easting.toFixed(2)  + " m";
    northingValue.textContent = northing.toFixed(2) + " m";
    rotationValue.textContent = rotationDeg.toFixed(2) + "\u00B0";
    opacityValue.textContent  = Math.round(opacity) + "%";

    vectorLayer.setOpacity(opacity / 100);

    if (!currentFeatures.length || !centroidMerc) return;

    var rotationRad = rotationDeg * Math.PI / 180;
    var scale = mercatorScaleFactor(centroidLat);
    var dxMap = easting  * scale;
    var dyMap = northing * scale;

    currentFeatures.forEach(function(feature, idx){
      // Always start from the pristine original geometry to avoid
      // accumulated rounding error across repeated slider adjustments.
      var geom = originalGeometries[idx].clone();
      geom.rotate(rotationRad, centroidMerc);
      geom.translate(dxMap, dyMap);
      feature.setGeometry(geom);
    });
  }

  /* ============================================================
     RESET
     ============================================================ */
  function resetControls(){
    opacitySlider.value  = 50;
    eastingSlider.value  = 0;
    northingSlider.value = 0;
    rotationSlider.value = 0;
    updateTransform();
  }

  /* ============================================================
     EXPORT: CORRECTED KML
     ============================================================
     The original KML XML is re-parsed fresh from the pristine stored
     text (never the mutated DOM) and only the contents of every
     <coordinates> element are rewritten. Everything else — folders,
     placemark names, styles, extended data, schema — is left exactly
     as uploaded, so the exported file preserves the full original
     document structure.
     ============================================================ */
  function downloadCorrectedKml(){
    if (!originalKmlText){
      alert("Please upload a KML file first.");
      return;
    }

    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(originalKmlText, "text/xml");

    var parseErrors = xmlDoc.getElementsByTagName("parsererror");
    if (parseErrors.length){
      alert("The original KML could not be re-parsed for export.");
      return;
    }

    var easting     = parseFloat(eastingSlider.value);
    var northing    = parseFloat(northingSlider.value);
    var rotationDeg = parseFloat(rotationSlider.value);
    var rotationRad = rotationDeg * Math.PI / 180;
    var scale = mercatorScaleFactor(centroidLat);
    var dxMap = easting  * scale;
    var dyMap = northing * scale;

    var coordNodes = xmlDoc.getElementsByTagName("coordinates");

    for (var i = 0; i < coordNodes.length; i++){
      var node = coordNodes[i];
      var raw = node.textContent.trim();
      if (!raw) continue;

      var tuples = raw.split(/\s+/).filter(function(t){ return t.length > 0; });

      var transformedTuples = tuples.map(function(tuple){
        var parts = tuple.split(",");
        var lon = parseFloat(parts[0]);
        var lat = parseFloat(parts[1]);
        var alt = parts.length > 2 ? parts[2] : null;

        var merc = ol.proj.fromLonLat([lon, lat]);
        var moved = rotateThenTranslate(merc[0], merc[1], rotationRad, centroidMerc, dxMap, dyMap);
        var lonLat = ol.proj.toLonLat(moved);

        var out = lonLat[0].toFixed(8) + "," + lonLat[1].toFixed(8);
        if (alt !== null) out += "," + alt;
        return out;
      });

      node.textContent = transformedTuples.join(" ");
    }

    var serializer = new XMLSerializer();
    var outText = serializer.serializeToString(xmlDoc);
    if (outText.indexOf("<?xml") !== 0){
      outText = '<?xml version="1.0" encoding="UTF-8"?>\n' + outText;
    }

    var blob = new Blob([outText], { type: "application/vnd.google-earth.kml+xml" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = "Corrected_" + fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ============================================================
     EVENT WIRING
     ============================================================ */
  opacitySlider.addEventListener("input", updateTransform);
  eastingSlider.addEventListener("input", updateTransform);
  northingSlider.addEventListener("input", updateTransform);
  rotationSlider.addEventListener("input", updateTransform);

  resetBtn.addEventListener("click", resetControls);
  downloadBtn.addEventListener("click", downloadCorrectedKml);

  // Initialise readouts to their default state on load.
  updateTransform();

})();
</script>

</body>
</html>
